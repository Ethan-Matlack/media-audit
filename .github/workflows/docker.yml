# Build, test and publish the Docker image to GitHub Container Registry.
#
#   pull request      -> test image only (lint, mypy, pytest with real MediaInfo + ffmpeg)
#   push to main      -> test, then publish ghcr.io/<owner>/media-audit:latest and :sha-<short>
#   push tag v1.2.3   -> test, then publish :1.2.3 and :1.2
#
# Publishing uses the built-in GITHUB_TOKEN; no secrets to configure. After the first
# publish, make the package public (GitHub -> Packages -> media-audit -> Package
# settings -> Change visibility) so Unraid can pull it without logging in.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/media_audit/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match __version__ $version in src/media_audit/__init__.py"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: media-audit:test
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test
      - name: Lint, type-check and test
        run: docker run --rm media-audit:test

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases this (GHCR names must be lowercase).
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
