# media-audit configuration. Copy to config.yml (or /config/config.yml in Docker).
# Any key can be overridden with an environment variable: MEDIA_AUDIT_<KEY>, using
# "__" for nesting, e.g. MEDIA_AUDIT_SCAN__WORKERS=4. Relative paths are relative to
# this file.

# SQLite database. Keep it on local disk, not on the network share with the media.
database: /config/media-audit.db

libraries:
  # type: movies -> <root>/<Movie (Year)>/<files>
  # type: tv     -> <root>/<Show (Year)>/<Season NN>/<episodes>
  - name: movies
    path: /media/movies
    type: movies
  - name: movies-4k
    path: /media/movies-4k
    type: movies
  - name: tv
    path: /media/tv
    type: tv

scan:
  # Parallel MediaInfo readers. Keep low (1-4) for spinning disks and NFS/SMB mounts.
  workers: 2
  # MediaInfo ParseSpeed (0-1). 0 reads headers only (~1 MB, <3 s per file) and still
  # detects DV, HDR10+, Atmos and DTS:X. MediaInfo's own default of 0.5 can take minutes
  # per remux over NFS/SMB.
  parse_speed: 0
  # Files whose TrueHD stream isn't described in the MKV headers (so Atmos is unknown)
  # are re-parsed at this speed in a child process killed after retry_timeout seconds.
  # If that fails, the track title is used as an "Atmos?" hint. 0 disables the retry.
  retry_parse_speed: 0.05
  retry_timeout: 60
  # When `serve` (the Docker default) scans by itself: a cron expression in the
  # container's time zone (TZ), e.g. "0 3 * * *" = 03:00 daily, "0 */6 * * *" = every
  # 6 hours. "off" disables scheduled scans; the web UI's "Scan now" button still works.
  schedule: "0 3 * * *"
  follow_symlinks: false
  # Glob patterns matched against file/folder *names*. Setting this replaces the
  # defaults (NAS metadata dirs like @eaDir/#recycle, .DS_Store, *.part, ...).
  # ignore: ["@eaDir", "#recycle", ".*"]

# The web UI (`media-audit serve`). No login: keep it on your LAN or behind a reverse
# proxy. In Docker, change the published port rather than this one.
web:
  host: 0.0.0.0
  port: 8484

# Link the same movie/show across libraries (e.g. movies + movies-4k).
linking:
  by_id: true          # same {tmdb-..}/{imdb-..}/{tvdb-..}
  by_name_year: true   # same normalized title + year

languages:
  preferred_audio: [en]
  preferred_subtitles: []

# The Issues page. All optional; changes apply at the next scan or container start.
flags:
  # Checks to switch off everywhere, or per library (codes are listed in the README).
  disabled: []                       # e.g. [no_ids, legacy_codec]
  disabled_by_library: {}            # e.g. {anime: [no_preferred_audio]}
  min_peers: 4            # episodes a season needs before they're compared with each other
  short_runtime: 0.6      # episode shorter than 60% of its season's median length
  bitrate_low: 0.4        # episode GB/h below 40% of its season's median
  bitrate_high: 2.5       # ... or above 2.5x
  movie_bitrate_low: 0.25 # movie GB/h below 25% of the median for its resolution
  # Non-video, non-subtitle files expected in a library; anything else is a "stray file".
  allowed_extensions: [nfo, jpg, jpeg, png, webp, gif, tbn, bif, xml, json, sfv, md5]

# Reserved for later phases (naming rules, Radarr/Sonarr integrations).
naming: {}
integrations: {}
