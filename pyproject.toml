[project]
name = "media-audit"
version = "0.1.0.dev0"
description = "Scan a media library on disk and report what's actually in it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Ethan Matlack" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
]
# Every runtime dependency must be permissively licensed (see HANDOFF.md §2.7).
#   pymediainfo  MIT   (wraps libmediainfo, BSD-2-Clause, installed separately)
#   PyYAML       MIT
#   pydantic     MIT
dependencies = [
    "pymediainfo>=6.1,<8",
    "PyYAML>=6.0,<7",
    "pydantic>=2.9,<3",
]

[project.scripts]
media-audit = "media_audit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "mediainfo: needs libmediainfo installed (skipped otherwise)",
    "ffmpeg: needs ffmpeg to generate test media (skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
ignore = ["RUF001"]  # ambiguous unicode in strings is intentional in naming tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C408"]  # dict(k=v) reads better in expectation tables

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["media_audit"]

[[tool.mypy.overrides]]
module = ["pymediainfo"]
ignore_missing_imports = true
