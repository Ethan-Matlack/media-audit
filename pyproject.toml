[project]
name = "media-audit"
dynamic = ["version"]  # from src/media_audit/__init__.py (the only place to change it)
description = "Scan a media library on disk and report what's actually in it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Ethan Matlack" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
]
# Every runtime dependency must be permissively licensed (MIT/BSD/Apache-style; no GPL/LGPL).
#   pymediainfo  MIT   (wraps libmediainfo, BSD-2-Clause, installed separately)
#   PyYAML       MIT
#   pydantic     MIT
#   starlette    BSD-3-Clause  (web UI; pulls in anyio, MIT)
#   uvicorn      BSD-3-Clause  (pulls in h11 MIT, click BSD-3-Clause)
#   Jinja2       BSD-3-Clause  (pulls in MarkupSafe BSD-3-Clause)
dependencies = [
    "pymediainfo>=6.1,<8",
    "PyYAML>=6.0,<7",
    "pydantic>=2.9,<3",
    "starlette>=0.40,<1",
    "uvicorn>=0.30,<1",
    "Jinja2>=3.1,<4",
]

[project.scripts]
media-audit = "media_audit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "httpx>=0.27",  # starlette's TestClient
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/media_audit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/media_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # starlette's TestClient on newer anyio; not our code.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    "mediainfo: needs libmediainfo installed (skipped otherwise)",
    "ffmpeg: needs ffmpeg to generate test media (skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
ignore = ["RUF001"]  # ambiguous unicode in strings is intentional in naming tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C408"]  # dict(k=v) reads better in expectation tables

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["media_audit"]

[[tool.mypy.overrides]]
module = ["pymediainfo"]
ignore_missing_imports = true
